<!DOCTYPE html>
<html>
  <head>
    <title>Tippst Du ein Deine Quatsche!</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #e8e8e8;
        --muted: #888;
        --accent: #333;
        --border: #222;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 24px 0;
        text-align: center;
      }
      h2 {
        font-size: 1rem;
        font-weight: 500;
        color: var(--muted);
        margin: 40px 0 16px 0;
        text-align: center;
      }
      input, textarea {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--fg);
        font-family: inherit;
        font-size: 16px;
        padding: 14px 16px;
        width: 24rem;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus, textarea:focus {
        border-color: var(--fg);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
      }
      textarea {
        height: 12rem;
        resize: vertical;
      }
      #out {
        font-size: 18px;
        line-height: 1.6;
        cursor: pointer;
        user-select: none;
        background: var(--accent);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 20px;
        width: 100%;
        max-width: 48rem;
        margin-top: 16px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        transition: background 0.15s ease;
      }
      #out:hover {
        background: #3a3a3a;
      }
      #out:empty {
        display: none;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        text-align: center;
      }
    </style>
    <script src="script.js"></script>
  </head>
  <body>
    <h1>Tippst Du ein Deine Quatsche!</h1>
    <input
      placeholder="Type text to convert to NATO alphabet"
      type="text"
      autofocus
    />
    <textarea placeholder="Type NATO alphabet words to decode"></textarea>
  </body>
</html>
